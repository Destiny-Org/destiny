# Memory checks: runs the druntime and Fate unittests under valgrind and
# fails on memory errors and definite leaks (see ci/memcheck.sh).
# valgrind runs programs 20-50x slower, so this runs weekly and on demand
# instead of on every push.

name: Memory checks
on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  memcheck:
    name: valgrind, ${{ matrix.model }}-bit
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: [ '64', '32' ]
    env:
      DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
      OS_NAME: linux
      MODEL: ${{ matrix.model }}
      HOST_DC: destiny-2.115.0-master
      FULL_BUILD: false
    steps:
      - uses: actions/checkout@v7

      - name: Set environment variable N (parallelism)
        run: echo "N=$(nproc)" >> $GITHUB_ENV

      - name: Install prerequisites
        run: |
          sudo --preserve-env=OS_NAME,MODEL,HOST_DC,FULL_BUILD,N ci/cirrusci.sh
          sudo apt-get install -y valgrind

      - name: Install host compiler
        run: ci/run.sh install_host_compiler

      - name: Set up repos
        run: ci/run.sh setup_repos "${GITHUB_REF_NAME}"

      - name: Build
        run: ci/run.sh build

      - name: Memory checks
        run: ci/memcheck.sh
