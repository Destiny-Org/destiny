# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Main
on:
  pull_request: # without merge conflicts
    paths-ignore:
      - 'spec/**'
  push: # branch or tag
    paths-ignore:
      - 'spec/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-precommit:
    uses: ./.github/workflows/pre_commit.yml

  main:
    needs: call-precommit
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every job builds with a released Destiny compiler (Destiny-Org/host-compilers).
          # destiny64 is packaged for Linux x86_64 only, so only Linux jobs run;
          # macOS, Windows and FreeBSD return once Destiny is packaged for them.
          - job_name: Ubuntu 22.04 x64
            os: ubuntu-22.04
            host_dc: destiny-2.115.0-master
          - job_name: Ubuntu 22.04 x86
            os: ubuntu-22.04
            model: 32
            host_dc: destiny-2.115.0-master
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container_image }}
    timeout-minutes: 60 # OSX tests can still be running runnable at 40
    env:
      # read access to the private Destiny-Org repositories, for every clone in the build
      DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
      # for ci/run.sh:
      OS_NAME: ${{ matrix.vm_os || (startsWith(matrix.os, 'ubuntu') && 'linux' || (startsWith(matrix.os, 'macos') && 'osx' || (startsWith(matrix.os, 'windows') && 'windows' || ''))) }}
      MODEL: ${{ matrix.model || '64' }}
      HOST_DC: ${{ matrix.host_dc }}
      # N is set dynamically below
      FULL_BUILD: true
      # for coverage:
      DMD_TEST_COVERAGE: ${{ matrix.coverage && '1' || '0' }}
      # work around upstream issue 23517
      MACOSX_DEPLOYMENT_TARGET: '11'
    defaults:
      run:
        # cpa.sh comes with cross-platform-actions and delegates to the VM.
        # Use it by default for all `run` steps below, i.e., run them in the VM (with a bash shell).
        shell: ${{ matrix.vm_os && 'cpa.sh {0} --sync-files runner-to-vm --environment-variables OS_NAME MODEL HOST_DC CI_DFLAGS N FULL_BUILD DMD_TEST_COVERAGE DESTINY_REPO_TOKEN' || 'bash' }}
    steps:
      - name: Start VM
        if: matrix.vm_os
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: ${{ matrix.vm_os }}
          version: ${{ matrix.vm_os_version }}
          shell: bash
          memory: 12G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: 'Alpine container: Pre-install bash, git and sudo'
        if: startsWith(matrix.container_image, 'alpine')
        shell: sh
        run: apk add bash git sudo

      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Set environment variable N (parallelism)
        run: echo "N=$(${{ runner.os == 'macOS' && 'sysctl -n hw.logicalcpu' || 'nproc' }})" >> $GITHUB_ENV
        shell: bash  # don't run in VM, but host runner (for exporting env var)

      - name: 'Posix: Install prerequisites'
        if: runner.os != 'Windows'
        run: ${{ runner.os == 'macOS' && 'ci/cirrusci.sh' || 'sudo --preserve-env=OS_NAME,MODEL,HOST_DC,FULL_BUILD,N ci/cirrusci.sh' }}

      - name: 'macOS: Switch Xcode version if required'
        if: runner.os == 'macOS' && matrix.xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app

      - name: 'Posix: Install host compiler'
        if: runner.os != 'Windows'
        run: ci/run.sh install_host_compiler
      - name: 'Windows: Install host compiler'
        if: runner.os == 'Windows'
        shell: bash
        run: bash ci/host_compiler.sh "${{ matrix.host_dc }}"

      - name: Set up repos
        env:
          DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
        run: |
          set -uexo pipefail

          ref='${{ github.ref }}'
          if [[ "$ref" =~ ^refs/pull/ ]]; then
            # PR: clone the Fate head with the same name as this Destiny PR's target branch
            # e.g., Fate main when targeting destiny main
            REPO_BRANCH="$GITHUB_BASE_REF"
          elif [[ "$ref" =~ ^refs/(heads|tags)/(.*)$ ]]; then
            # no PR: try to clone the Fate head with the same name as this destiny head, falling back to main
            # e.g., Fate main for a push to destiny main
            REPO_BRANCH="${BASH_REMATCH[2]}"
          else
            echo "Error: unexpected GitHub ref '$ref'" >&2
            exit 1
          fi

          ci/run.sh setup_repos "$REPO_BRANCH"
      - name: Build
        run: ${{ matrix.disable_debug_for_dmd_unittests && 'ENABLE_DEBUG=0' || '' }} ci/run.sh build
      - name: Rebuild destiny (with enabled coverage)
        if: matrix.coverage
        run: ENABLE_RELEASE=0 ENABLE_DEBUG=1 ENABLE_COVERAGE=1 ci/run.sh rebuild
      - name: 'Windows: Set up MSVC environment' # some tests need cl.exe etc. in PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup_msvc.ps1 -Arch ${{ env.MODEL == '64' && 'x64' || 'x86' }}
      - name: Test destiny
        run: ci/run.sh test_destiny
      - name: Test druntime
        if: '!matrix.coverage && (success() || failure())'
        run: ci/run.sh test_druntime
      - name: 'Windows x86: Add 32-bit libcurl.dll to PATH (required for Fate unittests)'
        if: runner.os == 'Windows' && env.MODEL == '32' && !matrix.coverage && (success() || failure())
        run: |
          set -uexo pipefail
          if [[ "$HOST_DC" =~ ^ldc ]]; then
            echo "$(dirname "$DC")/../lib32" >> $GITHUB_PATH
          else # DMD
            echo "$(dirname "$DC")/../bin" >> $GITHUB_PATH
          fi
      - name: Test Fate
        if: '!matrix.coverage && (success() || failure())'
        run: ci/run.sh test_fate
      - name: Test self-compile
        if: '!matrix.coverage && (success() || failure())' # already re-built with enabled coverage
        run: ENABLE_RELEASE=0 ci/run.sh rebuild

  arm-qemu:
    needs: call-precommit
    name: 'Ubuntu 24.04 x64, destiny (AArch64 cross-compile via QEMU)'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # read access to the private Destiny-Org repositories, for every clone in the build
      DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
      OS_NAME: linux
      MODEL: 64
      HOST_DC: destiny-2.115.0-master
      FULL_BUILD: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Set environment variable N (parallelism)
        run: echo "N=$(nproc)" >> $GITHUB_ENV

      - name: Install prerequisites
        run: sudo --preserve-env=OS_NAME,MODEL,HOST_DC,FULL_BUILD,N ci/cirrusci.sh

      - name: Install host compiler
        run: ci/run.sh install_host_compiler

      - name: Set up repos
        env:
          DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
        run: |
          set -uexo pipefail
          ref='${{ github.ref }}'
          if [[ "$ref" =~ ^refs/pull/ ]]; then
            REPO_BRANCH="$GITHUB_BASE_REF"
          elif [[ "$ref" =~ ^refs/(heads|tags)/(.*)$ ]]; then
            REPO_BRANCH="${BASH_REMATCH[2]}"
          else
            echo "Error: unexpected GitHub ref '$ref'" >&2
            exit 1
          fi
          ci/run.sh setup_repos "$REPO_BRANCH"

      - name: Build destiny
        run: ci/run.sh build

      - name: Install AArch64 cross-compile tools
        run: sudo apt-get install -y qemu-user clang lld gcc-aarch64-linux-gnu

      - name: Test AArch64 cross-compile and run via QEMU
        run: |
          source ~/host-compilers/*/activate
          compiler/test/run.d arm
